        uses: actions/download-artifact@v4
        with:
          name: plugin-jar
          path: plugin

      - name: Start Purpur server
        run: |
          docker run -d \
            --name minecraft \
            -p 25565:25565 \
            -e EULA=TRUE \
            -e TYPE=PURPUR \
            -e VERSION=${{ matrix.mc-version }} \
            -e MEMORY=2G \
            -v "${{ github.workspace }}/plugin:/plugins" \
            itzg/minecraft-server:latest

      - name: Wait for server startup
        run: |
          for i in {1..60}; do
            if docker exec minecraft rcon-cli "list" >/dev/null 2>&1; then
              echo "Purpur server is ready"
              exit 0
            fi
            sleep 10
          done
          echo "Purpur server failed to start"
          docker logs minecraft
          exit 1

      - name: Test Lunamatic
        run: docker exec minecraft rcon-cli "luma cyclemoonstates"

      - name: Check server logs
        if: always()
        run: |
          docker logs minecraft 2>&1 | tee purpur.log
          if grep -E '\[ERROR\]:' purpur.log; then
            echo "Errors detected in Purpur logs"
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: docker rm -f minecraft || true

  test-folia:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        mc-version: ["26.2", "26.3"]

    steps:
      - name: Download plugin JAR
        uses: actions/download-artifact@v4
        with:
          name: plugin-jar
          path: plugin

      - name: Start Folia server
        run: |
          docker run -d \
            --name minecraft \
            -p 25565:25565 \
            -e EULA=TRUE \
            -e TYPE=FOLIA \
            -e VERSION=${{ matrix.mc-version }} \
            -e MEMORY=2G \
            -v "${{ github.workspace }}/plugin:/plugins" \
            itzg/minecraft-server:latest

      - name: Wait for server startup
        run: |
          for i in {1..60}; do
            if docker exec minecraft rcon-cli "list" >/dev/null 2>&1; then
              echo "Folia server is ready"
              exit 0
            fi
            sleep 10
          done
          echo "Folia server failed to start"
          docker logs minecraft
          exit 1

      - name: Test Lunamatic
        run: docker exec minecraft rcon-cli "luma cyclemoonstates"

      - name: Check server logs
        if: always()
        run: |
          docker logs minecraft 2>&1 | tee folia.log
          if grep -E '\[Lunamatic\].*\[ERROR\]' folia.log; then
            echo "Lunamatic errors detected in Folia logs"
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: docker rm -f minecraft || true