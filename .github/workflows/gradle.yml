name: Overall Status

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle Wrapper
        run: ./gradlew build

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: build/libs/*.jar

  dependency-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v4

  test-paper:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        mc-version: ["26.2", "26.3"]

    steps:
      - name: Download plugin JAR
        uses: actions/download-artifact@v4
        with:
          name: plugin-jar
          path: plugin

      - name: Start Paper server
        run: |
          docker run -d \
            --name minecraft \
            -p 25565:25565 \
            -e EULA=TRUE \
            -e TYPE=PAPER \
            -e VERSION=${{ matrix.mc-version }} \
            -e MEMORY=2G \
            -v "${{ github.workspace }}/plugin:/plugins" \
            itzg/minecraft-server:latest

      - name: Wait for server startup
        run: |
          for i in {1..60}; do
            if docker exec minecraft rcon-cli "list" >/dev/null 2>&1; then
              echo "Paper server is ready"
              exit 0
            fi
            sleep 10
          done
          echo "Paper server failed to start"
          docker logs minecraft
          exit 1

      - name: Test Lunamatic
        run: docker exec minecraft rcon-cli "luma cyclemoonstates"

      - name: Check server logs
        if: always()
        run: |
          docker logs minecraft 2>&1 | tee paper.log
          if grep -E '\[ERROR\]:' paper.log; then
            echo "Errors detected in Paper logs"
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: docker rm -f minecraft || true

  test-purpur:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        mc-version: ["26.2", "26.3"]

    steps:
